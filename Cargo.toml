[package]
name = "cargo-truesight"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Rust API reference and health checks generated from the compiler's view of a crate, with a gate that fails when the docs drift"
repository = "https://github.com/manaforged/truesight"
license = "MIT"
readme = "README.md"
keywords = ["rustdoc", "api", "documentation", "mdbook", "semver"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]
publish = false

[[bin]]
name = "cargo-truesight"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
public-api = { version = "=0.52.2", features = ["experimental-feature-that-can-be-removed-in-a-patch-release_re-export-rustdoc-types"] }
rustdoc-json = "=0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["unbounded_depth"] }
thiserror = "2.0.21"
toml = "1.1.6"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
rc_mutex = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
ignore_without_reason = "deny"
should_panic_without_expect = "deny"
